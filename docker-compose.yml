        - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pa29ranJhaHhxYnpleHFram5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODU4OTAsImV4cCI6MjA5NDg2MTg5MH0.M0s-dr4DGXiPQg3A6UESB2M3GssFk-UeEuNsM9xH108
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=https://nikokjrahxqbzexqkjnl.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pa29ranJhaHhxYnpleHFram5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODU4OTAsImV4cCI6MjA5NDg2MTg5MH0.M0s-dr4DGXiPQg3A6UESB2M3GssFk-UeEuNsM9xH108
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letscertify
      - ./certbot/www:/var/www/certbot
    depends_on:
      - admin_web

  certbot:
    image: certbot/certbot
    container_name: certbot_ssl
    volumes:
      - ./certbot/conf:/etc/letscertify
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit0 SIGTERM; while :; do certbot renew; sleep 12d; done'"
