server {
    listen 80;
    listen [::]:80;
    server_name pruebadedesarrollo.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pruebadedesarrollo.space;

    # Certificados SSL (Apuntando al volumen interno de Nginx)
    ssl_certificate /etc/letscertify/live/pruebadedesarrollo.space/fullchain.pem;
    ssl_certificate_key /etc/letscertify/live/pruebadedesarrollo.space/privkey.pem;

    # Configuraciones recomendadas de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://admin_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
